<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Advanced Offline PDF Utility Suite" />
  <title>Advanced PDF Utility Suite</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      padding: 14px 16px;
      text-align: center;
      font-weight: 700;
      font-size: 18px;
      border-bottom: 1px solid #334155;
      color: #38bdf8;
    }
    .tabs {
      background: #111827;
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(94px, 1fr));
      gap: 6px;
      border-bottom: 1px solid #334155;
    }
    .tab-btn {
      background: transparent;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 9px 6px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: 0.2s;
    }
    .tab-btn.active {
      background: #0f172a;
      color: #38bdf8;
      border-color: #38bdf8;
      font-weight: 700;
    }
    .content {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
    }
    .panel {
      display: none;
      background: #111827;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      min-height: 100%;
    }
    .panel.active { display: block; }
    h3 {
      color: #38bdf8;
      margin-bottom: 12px;
      font-size: 18px;
    }
    .form-group { margin-bottom: 12px; }
    label {
      display: block;
      margin-bottom: 6px;
      color: #e2e8f0;
      font-size: 12px;
      font-weight: 600;
    }
    input[type="file"], input[type="text"], input[type="number"], select, textarea {
      width: 100%;
      background: #0f172a;
      border: 1px solid #475569;
      color: #e2e8f0;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #38bdf8; }
    .button-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 10px 0;
    }
    button.action-btn, button.secondary-btn {
      padding: 10px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      color: white;
      min-width: 110px;
      flex: 1;
    }
    button.action-btn {
      background: linear-gradient(135deg, #2563eb, #38bdf8);
    }
    button.secondary-btn {
      background: #334155;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .box {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      margin-top: 10px;
    }
    .file-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid #334155;
      border-left: 3px solid #38bdf8;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
    }
    .file-item button {
      background: #ef4444;
      border: none;
      color: white;
      border-radius: 4px;
      padding: 5px 8px;
      cursor: pointer;
    }
    .page-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .page-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px;
      cursor: move;
    }
    .page-preview {
      background: white;
      border-radius: 4px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0f172a;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .page-actions {
      display: flex;
      gap: 5px;
      justify-content: center;
      margin-top: 6px;
    }
    .page-actions button {
      background: #1d4ed8;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 4px 6px;
      cursor: pointer;
      font-size: 11px;
    }
    .quality-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .quality-value {
      min-width: 52px;
      text-align: center;
      background: #1d4ed8;
      border-radius: 4px;
      padding: 6px 8px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid #38bdf8;
      color: #7dd3fc;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      margin-top: 6px;
    }
    .preview-area {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px;
      margin-top: 10px;
      min-height: 200px;
      overflow: auto;
    }
    canvas, img, video {
      max-width: 100%;
      border-radius: 8px;
      display: block;
      margin: 8px 0;
    }
    .progress-bar {
      height: 8px;
      background: #334155;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 8px;
    }
    .progress-fill {
      background: linear-gradient(90deg, #38bdf8, #10b981);
      height: 100%;
      width: 0%;
      transition: width 0.2s ease;
    }
    small { color: #94a3b8; font-size: 11px; }
    .hidden { display: none !important; }
    @media (max-width: 480px) {
      .tabs { grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="header">📄 Advanced PDF Utility Suite</div>

  <div class="tabs" id="tabs"></div>
  <div class="content" id="content"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="app-advanced-pdf.js"></script>
</body>
</html>
